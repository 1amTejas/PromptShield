[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptshield"
version = "0.2.0"
description = "A lightweight defense layer that detects, classifies and sanitizes prompt-injection attempts before they reach your LLM."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "1amTejas" }]
keywords = ["llm", "security", "prompt-injection", "jailbreak", "guardrails"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
local = ["torch>=2.2", "transformers>=4.41"]
openai = ["openai>=1.35"]
anthropic = ["anthropic>=0.40"]
server = ["fastapi>=0.111", "uvicorn>=0.30"]
demo = ["gradio>=4.36"]
train = ["torch>=2.2", "transformers>=4.41", "datasets>=2.19", "accelerate>=0.30", "numpy"]
all = ["promptshield[local,openai,anthropic,server,demo,train]"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
promptshield = "promptshield.cli:main"

[tool.setuptools.packages.find]
include = ["promptshield*"]

[tool.setuptools.package-data]
promptshield = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]  # FastAPI's Body(...) default is the documented pattern
